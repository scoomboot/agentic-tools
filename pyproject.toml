[project]
name = "modo-tools"
version = "0.4.0"
description = "MCP server for working in Foundry Modo through the modo-tools kit"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = ["mcp>=1.10"]

[project.urls]
Homepage = "https://github.com/scoomboot/agentic-tools"

[project.scripts]
modo-tools = "modo_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package lives in server/ and installs as plain `modo_tools`.
packages = ["server/modo_tools"]
