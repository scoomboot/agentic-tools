  The Modo Tools menu, its toolbar button, and the start-up hook.

  The menu sits at the end of Modo's menu bar (menubar#tail, as Foundry's
  bundled Octane kit does it). The toolbar button opens the same sheet as a
  popover; it doesn't show in every layout, so the menu is the one the
  install steps rely on. Every command here is a modoTools.* command the kit
  blesses, or attr.formPopover; tests/test_install.py checks that.
-->
<configuration>
  <atom type="Attributes">

    <hash type="Sheet" key="modoTools_Menu:sheet">
      <atom type="Label">Modo Tools</atom>
      <hash type="InCategory" key="menubar#tail">
        <atom type="Ordinal">90</atom>
      </hash>
      <list type="Control" val="cmd modoTools.start">
        <atom type="Label">Start</atom>
        <atom type="Tooltip">Start listening so Claude can work in Modo through modo-tools.</atom>
        <atom type="Hash">modoTools_menuStart:control</atom>
      </list>
      <list type="Control" val="cmd modoTools.stop">
        <atom type="Label">Stop</atom>
        <atom type="Tooltip">Stop listening. A connected assistant loses access at once.</atom>
        <atom type="Hash">modoTools_menuStop:control</atom>
      </list>
      <list type="Control" val="cmd modoTools.status">
        <atom type="Label">Status</atom>
        <atom type="Tooltip">Write the kit's state to the event log: port, pump, queue, last session.</atom>
        <atom type="Hash">modoTools_menuStatus:control</atom>
      </list>
      <list type="Control" val="div ">
        <atom type="Alignment">full</atom>
        <atom type="Hash">modoTools_menuDiv1:control</atom>
      </list>
      <list type="Control" val="cmd modoTools.running ?">
        <atom type="Label">Running</atom>
        <atom type="BooleanStyle">checkmark</atom>
        <atom type="Tooltip">Ticked while modo-tools listens. Untick to stop it.</atom>
        <atom type="Hash">modoTools_menuRunning:control</atom>
      </list>
      <list type="Control" val="cmd modoTools.autostart ?">
        <atom type="Label">Start with Modo</atom>
        <atom type="BooleanStyle">checkmark</atom>
        <atom type="Tooltip">Start modo-tools whenever Modo starts. Off by default: it lets an assistant run code in Modo.</atom>
        <atom type="Hash">modoTools_menuAutostart:control</atom>
      </list>
      <list type="Control" val="div ">
        <atom type="Alignment">full</atom>
        <atom type="Hash">modoTools_menuDiv2:control</atom>
      </list>
      <list type="Control" val="cmd modoTools.opLog">
        <atom type="Label">Show Op Log</atom>
        <atom type="Tooltip">Write the op log's last lines to the event log. After a crash, the last op_start without an op_ok is what Modo was doing.</atom>
        <atom type="Hash">modoTools_menuOpLog:control</atom>
      </list>
      <list type="Control" val="cmd modoTools.folder">
        <atom type="Label">Open Data Folder</atom>
        <atom type="Tooltip">Open ~/.modo_tools: the access token, the op log, the Start with Modo flag. Keep the token private.</atom>
        <atom type="Hash">modoTools_menuFolder:control</atom>
      </list>
    </hash>

    <!-- One text button at the head of Modo's top toolbar, after modo-mcp's
         "MCP" (1.1). Attached with InCategory so it lives beside other kits'
         buttons instead of redefining the toolbar. -->
    <hash type="Sheet" key="modoTools_TopBar:sheet">
      <atom type="Label">Modo Tools</atom>
      <atom type="Layout">htoolbar</atom>
      <atom type="Justification">left</atom>
      <atom type="IconMode">text</atom>
      <atom type="IconSize">small</atom>
      <hash type="InCategory" key="TemplateModesToolbar#head">
        <atom type="Ordinal">1.2</atom>
      </hash>
      <list type="Control" val="cmd attr.formPopover {modoTools_Menu:sheet}">
        <atom type="Label">MT</atom>
        <atom type="Tooltip">Modo Tools: start, stop, status and options.</atom>
        <atom type="Hash">modoTools_TopBarButton:control</atom>
      </list>
    </hash>

  </atom>

  <!-- Once per Modo start, after the kit scan: starts the kit only when
       Start with Modo is on. -->
  <atom type="StartupCommands">
    <list type="Command">modoTools.boot</list>
  </atom>
</configuration>
